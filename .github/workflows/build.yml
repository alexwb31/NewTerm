name: CI

on:
  push:
    paths-ignore:
      - '.gitignore'
      - '**/*.md'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - '**/*.md'
      - 'assets/**'
  workflow_dispatch:

jobs:
  build:
    name: Build (rootless)
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install build tools
      run: brew install ldid xz make
    - name: Set up Theos
      run: git clone --recursive --depth=1 'https://github.com/theos/theos.git' ~/theos
    - name: Compile
      id: package_build
      run: |
        gmake package THEOS=~/theos ROOTLESS=1 FINALPACKAGE=1
        echo "package=$(cat .theos/last_package)" >> $GITHUB_OUTPUT
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NewTerm3-rootless
        path: '${{ steps.package_build.outputs.package }}'
