name: CI

on:
  push:
    paths-ignore:
      - '.gitignore'
      - '**/*.md'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - '**/*.md'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug build (unstripped, for symbolicated crash logs)'
        type: boolean
        default: false
      runner:
        description: 'Runner label (macos-15 = Apple Silicon, macos-15-intel = Intel)'
        type: string
        default: macos-15

jobs:
  build:
    name: Build (rootless)
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install build tools
      run: brew install ldid xz make cmark
    - name: Set up Theos
      run: git clone --recursive --depth=1 'https://github.com/theos/theos.git' ~/theos
    - name: Show toolchain and resolved packages
      run: |
        xcodebuild -version
        xcodebuild -resolvePackageDependencies -project NewTerm.xcodeproj -scheme 'NewTerm (iOS)' | grep -A5 'Resolved source packages'
    - name: Compile
      id: package_build
      run: |
        if [ "${{ inputs.debug }}" = "true" ]; then FINAL=0; else FINAL=1; fi
        gmake package THEOS=~/theos ROOTLESS=1 FINALPACKAGE=$FINAL
        echo "package=$(cat .theos/last_package)" >> $GITHUB_OUTPUT
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NewTerm3-rootless${{ inputs.debug && '-debug' || '' }}
        path: '${{ steps.package_build.outputs.package }}'
